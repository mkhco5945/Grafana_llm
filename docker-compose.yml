services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  demo:
    build:
      context: ./demo
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      prometheus:
        condition: service_healthy
      demo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mkhco-ai-dashboard-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-ai-plugin/dist:/var/lib/grafana/plugins/mkhco-ai-dashboard-app:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mcp-grafana:
    image: grafana/mcp-grafana:1.6.0
    depends_on:
      grafana:
        condition: service_healthy
    command:
      - --transport
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --endpoint-path
      - /mcp
      - --allowed-hosts
      - localhost:8000,127.0.0.1:8000,localhost:8002,127.0.0.1:8002,mcp-grafana:8000
      - --disable-assistant
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_MCP_SERVICE_ACCOUNT_TOKEN:?Set GRAFANA_MCP_SERVICE_ACCOUNT_TOKEN in .env}
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:?Set MCP_GRAFANA_SERVER_TOKEN in .env}
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost:8000\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ai-bridge:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      demo:
        condition: service_healthy
      mcp-grafana:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_API_HOST: 0.0.0.0
      AI_API_PORT: 8010
      AI_CHAT_DB_PATH: /app/.state/ai-chat.sqlite3
      MCP_GRAFANA_URL: http://mcp-grafana:8000/mcp
      DEMO_API_URL: http://demo:8000
      OLLAMA_URL: ${OLLAMA_CONTAINER_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.state:/app/.state
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
